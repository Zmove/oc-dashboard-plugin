<?= $this->styles() ?>
<div class="<?= $this->rootClass() ?>">
    <?php if (isset($error)): ?>
        <p class="zm-dash-error"><?= e($error) ?></p>
    <?php elseif (!$iframe): ?>
        <div class="zm-dash-placeholder">
            <span class="zm-dash-badge zm-dash-tone--iframe"><?= $this->badgeIcon('ph ph-browser') ?></span>
            <p class="zm-dash-empty">Aucun code iframe valide renseigné. Collez le code d'intégration (balise &lt;iframe&gt;) dans la configuration du module.</p>
        </div>
    <?php else: ?>
        <div class="zm-dash-header">
            <span class="zm-dash-badge zm-dash-tone--iframe"><?= $this->badgeIcon('ph ph-browser') ?></span>
            <div class="zm-dash-text">
                <span class="zm-dash-eyebrow"><?= e($this->widgetTitle()) ?></span>
                <p class="zm-dash-headline"><?= e($headline) ?></p>
            </div>
        </div>

        <div class="zm-dash-body">
            <iframe
                class="zm-dash-iframe"
                src="<?= e($iframe['src']) ?>"
                style="height: <?= (int) $height ?>px"
                <?php foreach ($iframe['attributes'] as $name => $value): ?>
                    <?= e($name) ?>="<?= e($value) ?>"
                <?php endforeach ?>
                <?php if ($iframe['allowfullscreen']): ?>allowfullscreen<?php endif ?>
            ></iframe>
        </div>

        <div class="zm-dash-footer">
            <a href="<?= e($iframe['src']) ?>" target="_blank" rel="noopener noreferrer">Ouvrir dans un nouvel onglet</a>
        </div>
    <?php endif ?>
</div>
